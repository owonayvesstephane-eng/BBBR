                'suppliers': [
                  {'name': 'Fournisseur A', 'price': 12000, 'delivery': 15000, 'distance': '2,1 km', 'delay': '1 h', 'rating': 4.7, 'reviews': 51},
                ],
              },
              {
                'name': 'Sable de construction',
                'category': 'Sable',
