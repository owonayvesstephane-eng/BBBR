            static final List<Map<String, dynamic>> drivers = [
              {'name': 'Yannick M.', 'phone': '+237 6 72 45 12 98', 'status': 'En livraison', 'rating': 4.8, 'trips': 124, 'eta': '12 min • 4,2 km'},
              {'name': 'Mbarga T.', 'phone': '+237 6 98 21 45 67', 'status': 'En livraison', 'rating': 4.7, 'trips': 98, 'eta': '20 min • 6,1 km'},
