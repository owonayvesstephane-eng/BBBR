            ];
          }

          class BatixApp extends StatelessWidget {
            const BatixApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'BATIX',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(brightness: Brightness.dark, scaffoldBackgroundColor: BatixColors.bgDark, primaryColor: BatixColors.green),
                home: const OnboardingScreen(),
              );
            }
          }

          // LOGO BATIX CENTRÉ PARTOUT
          class CenteredBatixLogo extends StatelessWidget {
            final double size;
            final bool showSub;
            final String sub;
            const CenteredBatixLogo({super.key, this.size = 72, this.showSub = true, this.sub = "L'approvisionnement intelligent\nde vos chantiers."});

            @override
            Widget build(BuildContext context) {
              return Center(
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Container(
                      width: size,
                      height: size,
                      decoration: BoxDecoration(
                        shape: BoxShape.circle,
                        border: Border.all(color: BatixColors.orange, width: 2.5),
                        boxShadow: [BoxShadow(color: BatixColors.green.withOpacity(0.35), blurRadius: 12)],
                      ),
                      child: ClipOval(child: Image.asset('assets/logo.png', fit: BoxFit.cover)),
                    ),
                    const SizedBox(height: 6),
                    RichText(
                      text: TextSpan(
                        style: TextStyle(fontSize: size * 0.40, fontWeight: FontWeight.w900, letterSpacing: 1.5),
                        children: const [
                          TextSpan(text: 'BATI', style: TextStyle(color: Colors.white)),
                          TextSpan(text: 'X', style: TextStyle(color: BatixColors.orange)),
                        ],
                      ),
                    ),
                    if (showSub)
                      Padding(
                        padding: const EdgeInsets.only(top: 2),
                        child: Text(sub, textAlign: TextAlign.center, style: const TextStyle(fontSize: 12, color: Colors.white70)),
                      ),
                  ],
                ),
              );
            }
          }

          // ÉCRAN 1 : ONBOARDING (Image 3 & 12)
          class OnboardingScreen extends StatelessWidget {
            const OnboardingScreen({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(gradient: BatixColors.darkGrad),
                  padding: const EdgeInsets.all(22),
                  child: SafeArea(
                    child: Column(
                      children: [
                        const CenteredBatixLogo(size: 90),
                        const SizedBox(height: 16),
                        Expanded(
                          child: ClipRRect(
                            borderRadius: BorderRadius.circular(24),
                            child: Image.asset('assets/images/hero_truck.png', width: double.infinity, fit: BoxFit.cover),
                          ),
                        ),
                        const SizedBox(height: 16),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceEvenly,
