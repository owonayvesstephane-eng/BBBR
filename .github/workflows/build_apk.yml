                'suppliers': [
                  {'name': 'Fournisseur A', 'price': 4200, 'delivery': 25000, 'distance': '3,2 km', 'delay': '1 h', 'rating': 4.8, 'reviews': 80},
                  {'name': 'Fournisseur B', 'price': 4100, 'delivery': 28000, 'distance': '5,0 km', 'delay': '2 h', 'rating': 4.5, 'reviews': 45},
                ],
              },
              {
