                                const SizedBox(width: 6),
                                Expanded(child: Image.asset('assets/images/photo2_cargaison.png', height: 70, fit: BoxFit.cover)),
                                const SizedBox(width: 6),
                                Expanded(child: Image.asset('assets/images/photo3_sol.png', height: 70, fit: BoxFit.cover)),
                              ],
                            ),
                            const SizedBox(height: 8),
                            const Text('✓ 3 Photos Caméra Directe   ✓ GPS < 150m   ✓ Signature & Code 4 chiffres OK', style: TextStyle(fontSize: 12, color: Colors.white70)),
                          ],
                        ),
                      );
                    }),
                  ],
                ),
              );
            }
          }
          EOF

      - name: 7. Compilation de l'APK et création du ZIP complet
        working-directory: batix_app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
          zip -r ../BATIX_Projet_Complet.zip . -x "build/*" ".dart_tool/*"

      - name: 8. Télécharger l'application APK finale
        uses: actions/upload-artifact@v4
        with:
          name: BATIX-Application-APK
          path: batix_app/build/app/outputs/flutter-apk/app-release.apk

      - name: 9. Télécharger le projet complet ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BATIX-Projet-Complet-ZIP
          path: BATIX_Projet_Complet.zip
