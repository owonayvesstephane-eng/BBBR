            void _openSupplierSheet(BuildContext context, Map<String, dynamic> product) {
              final List suppliers = product['suppliers'] as List;
              int selectedSupplierIdx = suppliers.length > 1 ? 1 : 0;
              int quantity = 50;

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: BatixColors.bgDark,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(24))),
                builder: (ctx) {
                  return StatefulBuilder(
                    builder: (ctx, setModalState) {
                      final chosen = suppliers[selectedSupplierIdx];
                      final int unitPrice = chosen['price'] as int;
                      final int delivery = chosen['delivery'] as int;
                      final int total = (unitPrice * quantity) + delivery;

                      return Padding(
                        padding: const EdgeInsets.all(20),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              '${product['name']} • Choix du Fournisseur',
                              style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold),
                            ),
                            const SizedBox(height: 12),
                            ...List.generate(suppliers.length, (i) {
                              final s = suppliers[i];
                              final isSel = i == selectedSupplierIdx;
                              return GestureDetector(
                                onTap: () => setModalState(() => selectedSupplierIdx = i),
                                child: Container(
                                  margin: const EdgeInsets.only(bottom: 8),
                                  padding: const EdgeInsets.all(12),
                                  decoration: BoxDecoration(
                                    color: isSel ? BatixColors.green.withOpacity(0.2) : BatixColors.bgCard,
                                    borderRadius: BorderRadius.circular(12),
                                    border: Border.all(color: isSel ? BatixColors.greenLight : BatixColors.border),
                                  ),
                                  child: Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      Text('${s['name']} (Délai ${s['delay']})', style: const TextStyle(fontWeight: FontWeight.bold)),
                                      Text('${s['price']} FCFA/${product['unit']}',
                                          style: const TextStyle(color: BatixColors.orangeLight, fontWeight: FontWeight.bold)),
                                    ],
                                  ),
                                ),
                              );
                            }),
                            const SizedBox(height: 10),
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                const Text('Quantité souhaitée :'),
                                Row(
                                  children: [
                                    IconButton(
                                      icon: const Icon(Icons.remove_circle_outline, color: BatixColors.orange),
                                      onPressed: () {
                                        if (quantity > 10) setModalState(() => quantity -= 10);
                                      },
                                    ),
                                    Text('$quantity', style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                                    IconButton(
                                      icon: const Icon(Icons.add_circle_outline, color: BatixColors.greenLight),
                                      onPressed: () => setModalState(() => quantity += 10),
                                    ),
                                  ],
                                ),
                              ],
                            ),
                            const SizedBox(height: 10),
                            Text('Total Livré : $total FCFA',
                                style: const TextStyle(fontSize: 19, fontWeight: FontWeight.bold, color: BatixColors.greenLight)),
                            const SizedBox(height: 14),
                            SizedBox(
                              width: double.infinity,
                              height: 50,
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(backgroundColor: BatixColors.orange),
                                onPressed: () {
                                  final String pin = (1000 + Random().nextInt(9000)).toString();
                                  AppDatabase.orders.insert(
                                    0,
                                    OrderModel(
                                      id: 'CMD-2026-00${AppDatabase.orders.length + 125}',
                                      productName: product['name'],
                                      supplierName: chosen['name'],
                                      unitPrice: unitPrice,
                                      deliveryFee: delivery,
                                      quantity: quantity,
                                      destination: 'Chantier Yaoundé',
                                      secretCode: pin,
                                    ),
                                  );
                                  Navigator.pop(ctx);
                                  setState(() => _selectedIndex = 1);
                                },
                                child: const Text('Commander & Générer le Code Secret à 4 chiffres'),
                              ),
