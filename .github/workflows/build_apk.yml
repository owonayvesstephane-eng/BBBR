            int _step = 2; // 2: GPS 3D, 3: 3 Photos Caméra directe, 4: Signature & Code 4 cases
            final ImagePicker _picker = ImagePicker();
            final List<Offset?> _sig = [];
            final List<String> _pinDigits = ['8', '4', '1', '9'];

            @override
            void initState() {
              super.initState();
              final chars = widget.order.secretCode.split('');
              if (chars.length == 4) {
                for (int i = 0; i < 4; i++) {
                  _pinDigits[i] = chars[i];
                }
              }
            }

            Future<void> _takeDirectPhoto(int numPhoto) async {
              if (numPhoto == 2 && widget.order.photo1Matricule == null) return;
              if (numPhoto == 3 && widget.order.photo2Cargaison == null) return;
              try {
                await _picker.pickImage(source: ImageSource.camera, imageQuality: 80);
              } catch (_) {}
              setState(() {
                if (numPhoto == 1) widget.order.photo1Matricule = 'OK';
                if (numPhoto == 2) widget.order.photo2Cargaison = 'OK';
                if (numPhoto == 3) widget.order.photo3Sol = 'OK';
              });
            }

            @override
            Widget build(BuildContext context) {
              final o = widget.order;
              return Scaffold(
                appBar: AppBar(backgroundColor: BatixColors.bgDark, title: Text('Étape $_step / 4 • ${o.id}')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    if (_step == 2) ...[
                      const Text('2. GPS - Lieu de livraison (Navigation 3D)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 10),
                      Container(
                        padding: const EdgeInsets.all(12),
                        decoration: BoxDecoration(color: BatixColors.bgCard, borderRadius: BorderRadius.circular(14)),
                        child: Row(
                          children: const [
                            Icon(Icons.turn_right_rounded, color: Colors.white, size: 34),
                            SizedBox(width: 10),
                            Text('Tourner à droite à 500m\n15 min restantes • 2,4 km', style: TextStyle(fontWeight: FontWeight.bold)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 12),
                      ClipRRect(borderRadius: BorderRadius.circular(20), child: Image.asset('assets/images/gps_3d.png', height: 280, fit: BoxFit.cover)),
                      const SizedBox(height: 16),
                      _AuthBtn('Arriver au chantier & Filmer les 3 preuves →', Icons.camera_alt, BatixColors.green, () => setState(() => _step = 3)),
                    ] else if (_step == 3) ...[
                      const Text('3. Preuve de livraison (Caméra directe obligatoire)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 12),
                      _PhotoStepCard(
                        numStep: 1,
                        title: '1. Filmer le matricule du camion',
                        asset: 'assets/images/photo1_matricule.png',
                        done: o.photo1Matricule != null,
                        onTap: () => _takeDirectPhoto(1),
                      ),
                      _PhotoStepCard(
                        numStep: 2,
                        title: '2. Filmer le camion avec la marchandise',
                        asset: 'assets/images/photo2_cargaison.png',
                        done: o.photo2Cargaison != null,
                        onTap: () => _takeDirectPhoto(2),
                      ),
                      _PhotoStepCard(
                        numStep: 3,
                        title: '3. Filmer la marchandise au sol',
                        asset: 'assets/images/photo3_sol.png',
                        done: o.photo3Sol != null,
                        onTap: () => _takeDirectPhoto(3),
                      ),
                      const SizedBox(height: 12),
                      _AuthBtn('Valider les preuves  →', Icons.check, BatixColors.green, () {
                        setState(() {
                          o.photo1Matricule ??= 'OK';
                          o.photo2Cargaison ??= 'OK';
                          o.photo3Sol ??= 'OK';
                          _step = 4;
                        });
                      }),
                    ] else ...[
                      const Text('4. Signer et entrer le code secret', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 10),
                      const Text('Signature du client (Signez au doigt) :'),
                      const SizedBox(height: 6),
                      Container(
                        height: 140,
                        decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(16)),
                        child: GestureDetector(
                          onPanUpdate: (d) => setState(() => _sig.add(d.localPosition)),
                          onPanEnd: (_) => _sig.add(null),
                          child: CustomPaint(painter: _SigPainter(_sig), size: Size.infinite),
                        ),
                      ),
                      const SizedBox(height: 16),
                      const Text('Code de validation à 4 chiffres du client :', style: TextStyle(fontWeight: FontWeight.bold)),
                      const SizedBox(height: 10),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: List.generate(4, (i) {
                          return Container(
                            width: 62,
                            height: 62,
                            decoration: BoxDecoration(
                              color: BatixColors.bgCard,
                              borderRadius: BorderRadius.circular(14),
                              border: Border.all(color: BatixColors.greenLight, width: 2),
                            ),
                            child: Center(
                              child: Text(_pinDigits[i], style: const TextStyle(fontSize: 26, fontWeight: FontWeight.bold)),
                            ),
                          );
                        }),
                      ),
                      const SizedBox(height: 20),
                      _AuthBtn('✓ Confirmer la livraison  →', Icons.verified, BatixColors.green, () {
                        setState(() => o.status = 'Livrée');
                        Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => CelebrationScreen(title: 'Livraison effectuée !', order: o)));
                      }),
                    ],
                  ],
                ),
              );
            }
          }

