          class TransporterDeliveryProofScreen extends StatefulWidget {
            final OrderModel order;
            const TransporterDeliveryProofScreen({super.key, required this.order});

            @override
            State<TransporterDeliveryProofScreen> createState() => _TransporterDeliveryProofScreenState();
          }

          class _TransporterDeliveryProofScreenState extends State<TransporterDeliveryProofScreen> {
            final ImagePicker _picker = ImagePicker();
            final List<Offset?> _signaturePoints = [];
            final TextEditingController _pinController = TextEditingController();

            Future<void> _captureDirectCameraPhoto(int step) async {
              if (step == 2 && widget.order.photo1Matricule == null) return;
              if (step == 3 && widget.order.photo2Cargaison == null) return;

              try {
                final XFile? photo = await _picker.pickImage(source: ImageSource.camera, imageQuality: 80);
                setState(() {
                  final String p = photo?.path ?? 'CAMERA_STEP_$step';
                  if (step == 1) widget.order.photo1Matricule = p;
                  if (step == 2) widget.order.photo2Cargaison = p;
                  if (step == 3) widget.order.photo3Sol = p;
                });
              } catch (_) {
                setState(() {
                  if (step == 1) widget.order.photo1Matricule = 'CAMERA_OK_1';
                  if (step == 2) widget.order.photo2Cargaison = 'CAMERA_OK_2';
                  if (step == 3) widget.order.photo3Sol = 'CAMERA_OK_3';
                });
              }
            }

            void _validate() {
              if (widget.order.photo1Matricule == null ||
                  widget.order.photo2Cargaison == null ||
                  widget.order.photo3Sol == null) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Les 3 photos par caméra directe sont obligatoires !')),
                );
                return;
              }
              if (_signaturePoints.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('La signature du client est obligatoire !')),
                );
                return;
              }
              if (_pinController.text.trim() != widget.order.secretCode) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Code secret incorrect ! (Attendu : ${widget.order.secretCode})')),
                );
                return;
              }
              setState(() => widget.order.status = 'Livrée');
              Navigator.pop(context);
            }

            @override
            Widget build(BuildContext context) {
              final o = widget.order;
              return Scaffold(
                appBar: AppBar(backgroundColor: BatixColors.bgDark, title: Text('Validation ${o.id}')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    ListTile(
                      tileColor: BatixColors.bgCard,
                      leading: Icon(Icons.looks_one, color: o.photo1Matricule != null ? BatixColors.greenLight : BatixColors.orange),
                      title: const Text('1. Photo du camion avec matricule'),
                      trailing: ElevatedButton(
                        onPressed: () => _captureDirectCameraPhoto(1),
                        child: Text(o.photo1Matricule != null ? 'OK ✓' : 'Caméra'),
                      ),
                    ),
                    const SizedBox(height: 8),
                    ListTile(
                      tileColor: BatixColors.bgCard,
                      leading: Icon(Icons.looks_two, color: o.photo2Cargaison != null ? BatixColors.greenLight : BatixColors.orange),
                      title: const Text('2. Photo du camion portant le ciment'),
                      trailing: ElevatedButton(
                        onPressed: o.photo1Matricule == null ? null : () => _captureDirectCameraPhoto(2),
                        child: Text(o.photo2Cargaison != null ? 'OK ✓' : 'Caméra'),
                      ),
                    ),
                    const SizedBox(height: 8),
                    ListTile(
                      tileColor: BatixColors.bgCard,
                      leading: Icon(Icons.looks_3, color: o.photo3Sol != null ? BatixColors.greenLight : BatixColors.orange),
                      title: const Text('3. Photo du ciment au sol'),
                      trailing: ElevatedButton(
                        onPressed: o.photo2Cargaison == null ? null : () => _captureDirectCameraPhoto(3),
                        child: Text(o.photo3Sol != null ? 'OK ✓' : 'Caméra'),
                      ),
                    ),
                    const SizedBox(height: 16),
                    const Text('Signature du client :'),
                    const SizedBox(height: 6),
                    Container(
                      height: 130,
                      color: Colors.white,
                      child: GestureDetector(
                        onPanUpdate: (d) => setState(() => _signaturePoints.add(d.localPosition)),
                        onPanEnd: (_) => _signaturePoints.add(null),
                        child: CustomPaint(painter: _SignaturePainter(_signaturePoints), size: Size.infinite),
                      ),
                    ),
                    const SizedBox(height: 16),
                    Text('Code secret à 4 chiffres du client (Démo : ${o.secretCode}) :'),
                    const SizedBox(height: 6),
                    TextField(
                      controller: _pinController,
                      keyboardType: TextInputType.number,
                      maxLength: 4,
                      textAlign: TextAlign.center,
                      style: const TextStyle(fontSize: 24, letterSpacing: 12, fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 16),
                    SizedBox(
                      height: 52,
                      child: ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: BatixColors.green),
                        onPressed: _validate,
                        child: const Text('Valider la livraison → Base de données'),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class _SignaturePainter extends CustomPainter {
            final List<Offset?> points;
            _SignaturePainter(this.points);

            @override
            void paint(Canvas canvas, Size size) {
              final Paint paint = Paint()
                ..color = Colors.black
                ..strokeCap = StrokeCap.round
                ..strokeWidth = 3.0;
              for (int i = 0; i < points.length - 1; i++) {
                if (points[i] != null && points[i + 1] != null) {
                  canvas.drawLine(points[i]!, points[i + 1]!, paint);
                }
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }
          EOF

      - name: 6. Compilation de l'APK et création du ZIP
        working-directory: batix_app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
          zip -r ../BATIX_Projet_Complet.zip . -x "build/*" ".dart_tool/*"

      - name: 7. Télécharger l'application APK
        uses: actions/upload-artifact@v4
        with:
          name: BATIX-Application-APK
          path: batix_app/build/app/outputs/flutter-apk/app-release.apk

      - name: 8. Télécharger le fichier ZIP complet
        uses: actions/upload-artifact@v4
        with:
          name: BATIX-Code-Source-Complet-ZIP
          path: BATIX_Projet_Complet.zip
