name: Compiler BATIX APK & ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du dépôt
        uses: actions/checkout@v4

      - name: 2. Installation rapide de Flutter & Java 17
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: 3. Création du projet Flutter BATIX complet
        run: |
          rm -rf batix_app
          flutter create --platforms=android --org com.batix.platform --project-name batix_app batix_app
          mkdir -p batix_app/assets

          # Si vous avez mis logo.png dans le dépôt, on l'utilise, sinon on génère un logo 256x256 valide
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png batix_app/assets/logo.png
          elif [ -f "logo.png" ]; then
            cp logo.png batix_app/assets/logo.png
          else
            python3 -c '
          import zlib, struct
          w, h = 256, 256
          raw = b"".join(b"\x00" + b"\x00\xa8\x59" * w for _ in range(h))
          def ck(t, d): return struct.pack("!I", len(d)) + t + d + struct.pack("!I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + ck(b"IHDR", struct.pack("!IIBBBBB", w, h, 8, 2, 0, 0, 0)) + ck(b"IDAT", zlib.compress(raw, 9)) + ck(b"IEND", b"")
          open("batix_app/assets/logo.png", "wb").write(png)
          '
          fi

      - name: 4. Écriture de pubspec.yaml et des permissions Android
        run: |
          cat << 'EOF' > batix_app/pubspec.yaml
          name: batix_app
          description: BATIX - L'approvisionnement intelligent de vos chantiers.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_launcher_icons: ^0.13.1

          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/logo.png"
            adaptive_icon_background: "#08121E"
            adaptive_icon_foreground: "assets/logo.png"

          flutter:
            uses-material-design: true
            assets:
              - assets/logo.png
          EOF

          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <application/g' batix_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="batix_app"/android:label="BATIX"/g' batix_app/android/app/src/main/AndroidManifest.xml

      - name: 5. Injection automatique du code complet BATIX (lib/main.dart)
        run: |
          cat << 'EOF' > batix_app/lib/main.dart
