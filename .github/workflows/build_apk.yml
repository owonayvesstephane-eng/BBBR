                'category': 'Ciment',
                'unit': 'sac',
                'basePrice': 4700,
                'stock': 500,
                'alert': 50,
                'rating': 4.8,
                'reviews': 320,
                'asset': 'assets/images/ciment.png',
                'suppliers': [
                  {'name': 'Fournisseur A', 'price': 4700, 'delivery': 15000, 'distance': '1,2 km', 'delay': '30 min', 'rating': 4.8, 'reviews': 120},
                  {'name': 'Fournisseur B', 'price': 4850, 'delivery': 15000, 'distance': '2,5 km', 'delay': '1 h', 'rating': 4.5, 'reviews': 66},
                  {'name': 'Fournisseur C', 'price': 4990, 'delivery': 12000, 'distance': '4,8 km', 'delay': '3 h', 'rating': 4.6, 'reviews': 72},
                ],
              },
              {
                'name': 'Fer à béton 8mm',
                'category': 'Fer',
                'unit': 'barre',
                'basePrice': 3500,
                'stock': 250,
                'alert': 40,
                'rating': 4.7,
                'reviews': 185,
                'asset': 'assets/images/fer.png',
                'suppliers': [
                  {'name': 'Fournisseur A', 'price': 3500, 'delivery': 15000, 'distance': '1,8 km', 'delay': '45 min', 'rating': 4.8, 'reviews': 98},
                  {'name': 'Fournisseur B', 'price': 3650, 'delivery': 15000, 'distance': '2,9 km', 'delay': '1 h', 'rating': 4.6, 'reviews': 54},
                ],
              },
              {
                'name': 'Gravier 15/25',
                'category': 'Gravier',
                'unit': 'm³',
                'basePrice': 4200,
                'stock': 180,
                'alert': 30,
                'rating': 4.8,
