name: Compiler BATIX V2 (Assets HD ZIP + APK + Code ZIP)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-batix:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du dépôt
        uses: actions/checkout@v4

      - name: 2. Installation de Pillow (Images HD), Java 17 & Flutter
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          pip install pillow
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: 3. Génération des 14 Images HD & Création de BATIX_Assets_HD.zip
        run: |
          rm -rf batix_app
          flutter create --platforms=android --org com.batix.platform --project-name batix_app batix_app
          mkdir -p batix_app/assets/images
          mkdir -p batix_app/assets/icons

          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          os.makedirs("batix_app/assets/images", exist_ok=True)
          os.makedirs("batix_app/assets/icons", exist_ok=True)

          def grad(w, h, c1, c2):
              img = Image.new("RGBA", (w, h))
              d = ImageDraw.Draw(img)
              for y in range(h):
                  t = y / float(max(1, h - 1))
                  r = int(c1[0] + (c2[0] - c1[0]) * t)
                  g = int(c1[1] + (c2[1] - c1[1]) * t)
                  b = int(c1[2] + (c2[2] - c1[2]) * t)
                  d.line([(0, y), (w, y)], fill=(r, g, b, 255))
              return img

          # 1. LOGO BATIX HD CENTRÉ (512x512)
          logo = Image.new("RGBA", (512, 512), (8, 22, 34, 255))
          d = ImageDraw.Draw(logo)
          d.ellipse((36, 26, 476, 466), fill=(12, 42, 52, 255), outline=(0, 185, 95, 255), width=22)
          d.arc((20, 10, 492, 482), start=310, end=140, fill=(255, 145, 0, 255), width=14)
          d.rectangle((140, 130, 185, 300), fill=(15, 55, 85, 255), outline=(255, 255, 255, 180), width=2)
          d.rectangle((195, 95, 250, 300), fill=(10, 40, 68, 255), outline=(255, 255, 255, 180), width=2)
          d.rectangle((260, 145, 305, 300), fill=(18, 65, 95, 255), outline=(255, 255, 255, 180), width=2)
          d.line([(335, 95), (335, 260)], fill=(255, 165, 0, 255), width=6)
          d.line([(275, 110), (395, 110)], fill=(255, 165, 0, 255), width=6)
          d.polygon([(110, 430), (225, 295), (295, 295), (400, 430)], fill=(14, 28, 44, 255))
          d.line([(256, 305), (256, 425)], fill=(255, 255, 255, 220), width=6)
          d.rounded_rectangle((210, 210, 345, 290), radius=10, fill=(245, 248, 252, 255), outline=(10, 25, 41, 255), width=4)
          d.rounded_rectangle((335, 230, 385, 290), radius=8, fill=(255, 145, 0, 255), outline=(10, 25, 41, 255), width=4)
          d.ellipse((230, 275, 260, 305), fill=(20, 20, 20, 255), outline=(220, 220, 220, 255), width=4)
          d.ellipse((340, 275, 370, 305), fill=(20, 20, 20, 255), outline=(220, 220, 220, 255), width=4)
          logo.save("batix_app/assets/logo.png")
          logo.save("batix_app/assets/icons/app_icon_512.png")

          if os.path.exists("assets/logo.png"):
              os.system("cp assets/logo.png batix_app/assets/logo.png")
          elif os.path.exists("logo.png"):
              os.system("cp logo.png batix_app/assets/logo.png")

          # 2. HERO TRUCK COUCHER DE SOLEIL (800x500)
          hero = grad(800, 500, (255, 140, 40), (10, 28, 44))
          dh = ImageDraw.Draw(hero)
          dh.ellipse((80, 160, 240, 320), fill=(255, 220, 110, 255))
          for x, hb in [(50, 220), (120, 250), (280, 200), (350, 230), (580, 190), (660, 220), (730, 240)]:
              dh.rectangle((x, hb, x+55, 340), fill=(28, 42, 58, 255))
          dh.polygon([(0, 500), (310, 340), (490, 340), (800, 500)], fill=(24, 34, 46, 255))
          dh.line([(400, 340), (400, 500)], fill=(255, 190, 60, 255), width=6)
          dh.rounded_rectangle((260, 210, 480, 375), radius=12, fill=(245, 247, 250, 255), outline=(40, 55, 70, 255), width=4)
          dh.rounded_rectangle((460, 225, 575, 375), radius=16, fill=(255, 255, 255, 255), outline=(15, 30, 45, 255), width=5)
          dh.rounded_rectangle((475, 240, 560, 295), radius=8, fill=(20, 45, 70, 255))
          for wx in [290, 340, 440, 510]:
              dh.ellipse((wx, 350, wx+48, 398), fill=(18, 22, 26, 255), outline=(180, 190, 200, 255), width=5)
          hero.save("batix_app/assets/images/hero_truck.png")

          # 3. CIMENT 50KG (400x400)
          cim = grad(400, 400, (240, 235, 225), (210, 200, 185))
          dc = ImageDraw.Draw(cim)
          dc.rounded_rectangle((75, 45, 325, 355), radius=24, fill=(198, 162, 118, 255), outline=(140, 105, 65, 255), width=5)
          dc.rectangle((75, 130, 325, 265), fill=(235, 215, 185, 255))
          dc.rectangle((95, 150, 305, 195), fill=(0, 150, 80, 255))
          dc.rectangle((115, 215, 285, 245), fill=(255, 140, 0, 255))
          cim.save("batix_app/assets/images/ciment.png")

          # 4. FER À BÉTON (400x400)
          fer = grad(400, 400, (225, 232, 240), (175, 190, 205))
          df = ImageDraw.Draw(fer)
          for off in range(-90, 110, 28):
              df.line([(40, 280+off), (360, 100+off)], fill=(70, 82, 95, 255), width=20)
              df.line([(40, 276+off), (360, 96+off)], fill=(150, 165, 180, 255), width=6)
          fer.save("batix_app/assets/images/fer.png")

          # 5. GRAVIER (400x400)
          grav = grad(400, 400, (230, 235, 238), (190, 200, 208))
          dg = ImageDraw.Draw(grav)
          for gx in range(60, 330, 32):
              for gy in range(130, 330, 28):
                  if (gx - 200)**2 + (gy - 250)**2 < 140**2:
                      c = 90 + ((gx * gy) % 75)
                      dg.polygon([(gx, gy), (gx+26, gy-10), (gx+34, gy+16), (gx+8, gy+24)], fill=(c, c+5, c+10, 255), outline=(55, 60, 65, 255))
          grav.save("batix_app/assets/images/gravier.png")

          # 6. BOIS DE COFFRAGE (400x400)
          bois = grad(400, 400, (245, 235, 220), (220, 195, 165))
          db = ImageDraw.Draw(bois)
          for by in range(90, 310, 45):
              db.rounded_rectangle((50, by, 350, by+38), radius=6, fill=(195, 130, 65, 255), outline=(135, 80, 30, 255), width=4)
          bois.save("batix_app/assets/images/bois.png")

          # 7. BRIQUES / PARPAINGS (400x400)
          briq = grad(400, 400, (242, 232, 225), (215, 195, 180))
          dbr = ImageDraw.Draw(briq)
          for r in range(3):
              for c in range(2):
                  bx, by = 60 + c*145 + (r%2)*20, 95 + r*75
                  dbr.rounded_rectangle((bx, by, bx+130, by+65), radius=6, fill=(205, 95, 50, 255), outline=(145, 55, 25, 255), width=4)
          briq.save("batix_app/assets/images/brique.png")

          # 8. SABLE DE CONSTRUCTION (400x400)
          sab = grad(400, 400, (245, 238, 220), (225, 205, 165))
          ds = ImageDraw.Draw(sab)
          ds.polygon([(40, 330), (200, 120), (360, 330)], fill=(225, 182, 98, 255), outline=(185, 140, 60, 255))
          sab.save("batix_app/assets/images/sable.png")

          # 9. CARTE GPS SOMBRE (800x450)
          gmap = Image.new("RGBA", (800, 450), (12, 28, 44, 255))
          dm = ImageDraw.Draw(gmap)
          for x in range(0, 800, 55):
              dm.line([(x, 0), (x+40, 450)], fill=(22, 48, 72, 255), width=2)
          for y in range(0, 450, 55):
              dm.line([(0, y), (800, y+25)], fill=(22, 48, 72, 255), width=2)
          dm.line([(90, 320), (230, 250), (390, 280), (540, 170), (700, 130)], fill=(0, 215, 110, 255), width=10)
          dm.ellipse((65, 295, 115, 345), fill=(0, 195, 95, 255), outline=(255, 255, 255, 255), width=4)
          dm.ellipse((675, 105, 725, 155), fill=(255, 110, 30, 255), outline=(255, 255, 255, 255), width=4)
          gmap.save("batix_app/assets/images/gps_map.png")

          # 10. NAVIGATION GPS 3D CHAUFFEUR (800x500)
          nav3d = grad(800, 500, (8, 20, 32), (14, 38, 52))
          dn = ImageDraw.Draw(nav3d)
          dn.polygon([(120, 500), (330, 120), (470, 120), (680, 500)], fill=(26, 40, 56, 255))
          dn.line([(330, 120), (120, 500)], fill=(0, 185, 95, 255), width=5)
          dn.line([(470, 120), (680, 500)], fill=(0, 185, 95, 255), width=5)
          dn.line([(400, 420), (400, 180), (560, 180)], fill=(0, 230, 118, 255), width=14)
          dn.rounded_rectangle((340, 330, 460, 455), radius=14, fill=(245, 248, 252, 255), outline=(0, 185, 95, 255), width=4)
          nav3d.save("batix_app/assets/images/gps_3d.png")

          # 11, 12, 13. LES 3 PHOTOS DE PREUVE DE LIVRAISON (600x350)
          p1 = grad(600, 350, (45, 58, 72), (25, 34, 44))
          dp1 = ImageDraw.Draw(p1)
          dp1.rounded_rectangle((90, 30, 510, 270), radius=12, fill=(165, 45, 45, 255), outline=(30, 30, 30, 255), width=6)
          dp1.rounded_rectangle((195, 165, 405, 225), radius=6, fill=(245, 248, 252, 255), outline=(15, 25, 35, 255), width=4)
          p1.save("batix_app/assets/images/photo1_matricule.png")

          p2 = grad(600, 350, (115, 155, 195), (65, 85, 105))
          dp2 = ImageDraw.Draw(p2)
          dp2.rounded_rectangle((80, 70, 430, 265), radius=10, fill=(45, 95, 155, 255), outline=(25, 45, 70, 255), width=4)
          for r in range(4):
              for c in range(5):
                  dp2.rounded_rectangle((100+c*62, 85+r*35, 156+c*62, 115+r*35), radius=4, fill=(205, 185, 155, 255), outline=(140, 120, 95, 255), width=2)
          p2.save("batix_app/assets/images/photo2_cargaison.png")

          p3 = grad(600, 350, (165, 150, 130), (110, 95, 80))
          dp3 = ImageDraw.Draw(p3)
          for p in range(2):
              bx = 95 + p * 225
              dp3.rectangle((bx, 265, bx+185, 285), fill=(155, 105, 50, 255))
              for r in range(5):
                  for c in range(3):
                      dp3.rounded_rectangle((bx+c*60, 110+r*30, bx+56+c*60, 137+r*30), radius=4, fill=(210, 195, 170, 255), outline=(145, 130, 105, 255), width=2)
          p3.save("batix_app/assets/images/photo3_sol.png")

          # 14. CAMION 3D VALIDATION FINALE (500x400)
          ts = grad(500, 400, (8, 32, 28), (6, 18, 26))
          dts = ImageDraw.Draw(ts)
          dts.ellipse((150, 30, 350, 230), fill=(0, 200, 95, 255), outline=(120, 255, 180, 255), width=6)
          dts.line([(205, 130), (240, 165), (305, 95)], fill=(255, 255, 255, 255), width=14)
          dts.rounded_rectangle((110, 235, 340, 350), radius=12, fill=(240, 245, 250, 255), outline=(0, 185, 95, 255), width=4)
          dts.rounded_rectangle((330, 255, 405, 350), radius=10, fill=(255, 145, 0, 255), outline=(255, 255, 255, 255), width=3)
          ts.save("batix_app/assets/images/truck_success.png")
          PYEOF

          # Création immédiate du ZIP contenant uniquement les images et icônes HD
          cd batix_app && zip -r ../BATIX_Assets_HD_Images.zip assets/ && cd ..

      - name: 4. Envoi immédiat du dossier ZIP des Assets HD sur GitHub
        uses: actions/upload-artifact@v4
        with:
          name: BATIX-Dossier-Assets-HD-ZIP
          path: BATIX_Assets_HD_Images.zip

      - name: 5. Configuration de pubspec.yaml et des permissions Android
        run: |
          cat << 'EOF' > batix_app/pubspec.yaml
          name: batix_app
          description: BATIX - L'approvisionnement intelligent de vos chantiers.
          publish_to: 'none'
          version: 2.0.0+2

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_launcher_icons: ^0.13.1

          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/logo.png"
            adaptive_icon_background: "#081622"
            adaptive_icon_foreground: "assets/logo.png"

          flutter:
            uses-material-design: true
            assets:
              - assets/logo.png
              - assets/images/
              - assets/icons/
          EOF

          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <application/g' batix_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="batix_app"/android:label="BATIX"/g' batix_app/android/app/src/main/AndroidManifest.xml

      - name: 6. Injection du code complet BATIX V2 (Toutes les interfaces)
        run: |
          cat << 'EOF' > batix_app/lib/main.dart
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';

          void main() => runApp(const BatixApp());

          class BatixColors {
            static const Color bgDark = Color(0xFF071520);
            static const Color bgCard = Color(0xFF0E2433);
            static const Color border = Color(0xFF1B4358);
            static const Color green = Color(0xFF00B85C);
            static const Color greenLight = Color(0xFF10E578);
            static const Color orange = Color(0xFFFF8C00);
            static const Color orangeLight = Color(0xFFFFB700);

            static const LinearGradient orangeGrad = LinearGradient(colors: [Color(0xFFFF7B00), Color(0xFFFFB300)]);
            static const LinearGradient greenGrad = LinearGradient(colors: [Color(0xFF009E4F), Color(0xFF1AD16F)]);
            static const LinearGradient darkGrad = LinearGradient(
              colors: [Color(0xFF081B28), Color(0xFF06121B), Color(0xFF082420)],
              begin: Alignment.topLeft,
              end: Alignment.bottomRight,
            );
          }

          class OrderModel {
            final String id, productName, productAsset, supplierName, unit, clientName, clientPhone, destination, distance, duration, secretCode;
            final int unitPrice, deliveryFee, quantity;
            String status;
            String? photo1Matricule, photo2Cargaison, photo3Sol;
            bool isSigned;

            OrderModel({
              required this.id,
              required this.productName,
              required this.productAsset,
              required this.supplierName,
              required this.unitPrice,
              required this.deliveryFee,
              required this.quantity,
              this.unit = 'sacs (50kg)',
              this.clientName = 'Bâtiment Horizon',
              this.clientPhone = '+237 6 57 81 70 43',
              required this.destination,
              this.distance = '2,4 km',
              this.duration = '30 min',
              required this.secretCode,
              this.status = 'En cours',
              this.photo1Matricule,
              this.photo2Cargaison,
              this.photo3Sol,
              this.isSigned = false,
            });

            int get grandTotal => (unitPrice * quantity) + deliveryFee;
          }

          class AppDatabase {
            static final List<OrderModel> orders = [
              OrderModel(
                id: 'CMD-2025-0089',
                productName: 'Ciment CPJ 42.5',
